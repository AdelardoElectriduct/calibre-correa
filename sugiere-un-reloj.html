    </nav>

</header>
<div id="app">
<div class="wrap" style="padding-top:40px;padding-bottom:56px;max-width:640px;">
  <div class="section-head"><h2>Sugiere un reloj</h2><div class="sub">¿Hay un reloj que te gustaría ver analizado en la web? Cuéntanoslo, lo leemos todo.</div></div>
  <form id="sugForm" class="tool-box" style="max-width:100%;">
    <label for="reloj">Marca y modelo</label>
    <input type="text" id="reloj" name="reloj" required placeholder="Ej: Orient Bambino, Casio Duro...">
    <label for="motivo">¿Por qué te gustaría verlo aquí?</label>
    <input type="text" id="motivo" name="motivo" placeholder="Opcional">
    <label for="email">Tu email (opcional, por si queremos avisarte)</label>
    <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com">
    <input type="text" name="_gotcha" style="display:none">
    <button class="btn btn-primary" type="submit" id="sugBtn">Enviar sugerencia</button>
    <div id="sugMsg" role="status" aria-live="polite" style="margin-top:14px;"></div>
  </form>
</div>
</div>
<footer class="site">
  <div class="wrap">
    <div>&copy; <span id="year"></span> Calibre &amp; Correa</div>

<script>document.getElementById("year").textContent = new Date().getFullYear();
document.getElementById("navToggle").onclick = ()=>{
  const links = document.getElementById("navLinks");
  const btn = document.getElementById("navToggle");
  const open = links.classList.toggle("open");
  btn.setAttribute("aria-expanded", open ? "true" : "false");
};</script>
<script>
const form = document.getElementById("sugForm");
form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  const btn = document.getElementById("sugBtn");
  const msg = document.getElementById("sugMsg");
  btn.disabled = true; btn.textContent = "Enviando...";
  try{
    const res = await fetch("https://formspree.io/f/mgaedklq", {
      method: "POST",
      headers: {"Accept":"application/json"},
      body: new FormData(form)
    });
    if(res.ok){
      form.reset();
      form.style.display = "none";
      msg.innerHTML = '<div class="tool-result">¡Gracias! Hemos recibido tu sugerencia.</div>';
    }else{
      msg.innerHTML = '<div class="tool-result">Algo ha fallado, inténtalo de nuevo en un momento.</div>';
      btn.disabled = false; btn.textContent = "Enviar sugerencia";
    }
  }catch(err){
    msg.innerHTML = '<div class="tool-result">Algo ha fallado, inténtalo de nuevo en un momento.</div>';
    btn.disabled = false; btn.textContent = "Enviar sugerencia";
  }
});
</script>
